name: Release Cloud Docs Home

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check index.js && node --test navigation.test.cjs
      - run: zip -9 package.zip index.js index.css plugin.json README.md LICENSE icon.png preview.png
      - uses: softprops/action-gh-release@v2
        with:
          files: package.zip
          fail_on_unmatched_files: true
          body: |
            移动、重命名和文件夹标记后，侧栏立即显示结果。副本按实际路径定位，知识库篇数随新建、删除和跨库移动更新。
            搭配「云文档套件」v2.3.10 或更新版本，批量导入完成后立即刷新目录。
