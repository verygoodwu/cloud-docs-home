name: Release Cloud Docs Home

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check index.js && node --test navigation.test.cjs
      - run: zip -9 package.zip index.js index.css plugin.json README.md LICENSE icon.png preview.png
      - uses: softprops/action-gh-release@v2
        with:
          files: package.zip
          fail_on_unmatched_files: true
          body: 搭配「云文档套件」v2.3.8 或更新版本使用。打开导入的文档时，左侧自动展开父目录、滚动到文档并高亮该行。批量导入时，点击结果中的「打开」才会定位。
